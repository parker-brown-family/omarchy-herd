id = "brownfamilysports.crook"
name = "Crook"
version = "0.2.0"
# 0.7.5, not 0.7.0: plugin v1 landed in 0.7.0, but the [[startup]] hook this
# plugin needs to publish its first snapshot arrived in 0.7.5. On 0.7.0-0.7.4
# the manifest would link and the bar would stay empty until an agent happened
# to change state.
min_herdr_version = "0.7.5"
description = "Publish herdr agent state to the Omarchy bar"
platforms = ["linux"]

# A fresh snapshot whenever a server takes over — a restart, or a live handoff
# during `herdr update`. Without this the bar would show whatever the last
# server left behind until the next status change happened to fire.
[[startup]]
command = ["sh", "crook-sync.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "crook-sync.sh"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "crook-sync.sh"]

[[events]]
on = "pane.exited"
command = ["sh", "crook-sync.sh"]

[[events]]
on = "pane.closed"
command = ["sh", "crook-sync.sh"]

[[actions]]
id = "focus-blocked"
title = "Focus the blocked agent"
contexts = ["workspace"]
command = ["sh", "crook-focus.sh"]
